<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time since I found this issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
  :root {
    --bg: #fffff8;        /* warm Tufte paper */
    --fg: #111111;
    --muted: #6b6456;     /* warm sand-brown */
    --rule: #e7e0cf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'ET Book', 'Crimson Pro', Palatino, 'Palatino Linotype', Georgia, serif;
    font-weight: 400;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 1.5rem;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.1rem, 4vw, 1.7rem);
    letter-spacing: 0.01em;
    color: var(--muted);
  }
  #counter {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.5rem, 11vw, 6.5rem);
    line-height: 1.05;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }
  #sub {
    color: var(--muted);
    font-size: 1rem;
    font-style: italic;
  }
</style>
</head>
<body>
  <h1>Time since I found this issue</h1>
  <div id="counter">—</div>
  <div id="sub"></div>
  <script>
    // Set this to when the issue was found.
    const FOUND = new Date("2026-11-21T00:44:00Z");
    const counter = document.getElementById("counter");
    const sub = document.getElementById("sub");
    const pad = n => String(n).padStart(2, "0");
    function tick() {
      let ms = Date.now() - FOUND.getTime();
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      counter.textContent = `${d}d ${pad(h)}:${pad(m)}:${pad(sec)}`;
      sub.textContent = "found " + FOUND.toUTCString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
