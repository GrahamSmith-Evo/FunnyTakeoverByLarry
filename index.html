<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time since I found this issue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fira+Sans:300,400,700&display=swap">
<style>
  :root {
    --bg: #fcfcfc;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #f2f2f2; --muted: #8a8a8a; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Fira Sans", -apple-system, system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 1.25rem;
  }
  h1 {
    font-weight: 300;
    font-size: clamp(1rem, 4vw, 1.5rem);
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  #counter {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.25rem, 9vw, 5.5rem);
    line-height: 1.1;
  }
  #sub { color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
  <h1>Time since I found this issue</h1>
  <div id="counter">—</div>
  <div id="sub"></div>
  <script>
    // Set this to when the issue was found.
    const FOUND = new Date("2026-11-21T00:44:00Z");
    const counter = document.getElementById("counter");
    const sub = document.getElementById("sub");
    const pad = n => String(n).padStart(2, "0");
    function tick() {
      let ms = Date.now() - FOUND.getTime();
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      counter.textContent = `${d}d ${pad(h)}:${pad(m)}:${pad(sec)}`;
      sub.textContent = "found " + FOUND.toUTCString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
